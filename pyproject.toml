[project]
name = "greyhound-bins"
version = "0.1.0"
description = "Fetch Greyhound Recycling bin-collection schedule as table/JSON/ICS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
greyhound-bins = "fetch_schedule:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fetch_schedule.py"]

# Resolve from public PyPI so the project is portable and does not depend on
# any machine-specific default index configured in ~/.config/uv/uv.toml.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
